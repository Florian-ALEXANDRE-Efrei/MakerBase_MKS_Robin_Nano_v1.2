; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F103VE

[env:genericSTM32F103VE]
platform = ststm32
board = genericSTM32F103VE
framework = stm32cube
board_build.ldscript = STM32F103VE_robin.ld
board_build.stm32cube.custom_system_setup = yes
extra_scripts = post:mks_encrypt.py

; Firmware de diagnostic (voir diag/diag.c) : pio run -e diag  ->  out/diag/Robin_nano35.bin
[env:diag]
extends = env:genericSTM32F103VE
build_src_filter = -<*> +<../diag/diag.c>
custom_mks_out = out/diag
